# SamplerFilter page: the FILTER (an S950-style 6-pole low-pass, no resonance) alone on the left (r=58: larger
# knobs pass the MPC's 16384 px filmstrip limit and drift); the SAMPLER grit
# (BITS, RATE, and TRACK: the bandwidth filter before the sampling) and the INPUT / OUTPUT knobs on the right.
# Akai grey like Breaks (S950 / MPC60 front panel), taper knobs with an S950-green arc.
# Drawn by the browser renderer (vst.json "art": "html"); sizes and fixed colours in skin.css.
qlink_bounds=column
art_css=skin.css
knob_look=taper
theme_bg=c8c6bf
theme_panel=bdbbb3
theme_line=8e8b82
theme_ink=1c1c1c
theme_ink_dim=2e2e2e
theme_ink_faint=6e6b64
theme_accent=e8641c
theme_accent_hi=2a2a2a
theme_lcd=1a1f16
theme_box=1a1f16
theme_knob_face=2a2a2a
theme_knob_ring=2e2e2e
theme_knob_dot=7dff6a
theme_seg_active=7dff6a
theme_seg_active_tx=141414
theme_seg_inactive=a9a69e
theme_btn_text=f2f2f2
theme_btn_text_plain=f2f2f2

[tab SAMPLER]
frame x=10 y=92 w=360 h=612 title="FILTER"
knob cx=190 cy=370 r=58 label="FILTER" key=filter ns=34 vs=40 bw=300
frame x=380 y=92 w=890 h=300 title="SAMPLER"
# BITS / RATE are switches (bits_step / rate_step); the old bits / rate knobs only load old projects
enum_h cx=720 cy=215 label="BITS" key=bits_step sw=96 sh=46
enum_h cx=720 cy=328 label="RATE (kHz)" key=rate_step sw=72 sh=46
enum_v cx=1160 cy=268 label="TRACK" key=track sw=160
frame x=380 y=404 w=890 h=300 title="INPUT / OUTPUT"
knob cx=530 cy=534 r=52 label="DRIVE" key=drive ns=30 vs=34 bw=170
knob cx=825 cy=534 r=52 label="MIX" key=mix ns=30 vs=34 bw=170
knob cx=1120 cy=534 r=52 label="LEVEL" key=level ns=30 vs=34 bw=170
# Q-Links: each column of 4 is one frame (qlink_bounds=column): the filter, the sampler grit, input / output
qlinks "SAMPLER" = filter,-,-,-,bits_step,rate_step,track,-,drive,mix,level
