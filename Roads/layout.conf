# Roads pages: PIANO (the voice, its tone and EQ, the level), FX (vibrato, chorus, the envelope filter).
# Dressed as a Rhodes Suitcase's front panel: black tolex, a black name rail with chrome trim and wordmark, brushed
# aluminium faceplates with black lettering, black skirted knobs with metal caps (look=moog), and ivory / black
# key-style switches. Drawn by the browser renderer (vst.json "art": "html"); images/ and skin.css hold the art.
# MPC draws each knob's name itself from the parameter's name (params.json), not label=: labels here are the names,
# so the preview matches the device. scale_names / label_scale: names 28 px and values 30 px (17 / 22 px stock).
art_css=skin.css
knob_look=moog
frame_img=images/plate.svg
scale_names=1
label_scale=1.35
theme_bg=121111
theme_panel=c4c6c8
theme_line=5a5d61
theme_ink=161616
theme_ink_dim=2a2a2a
theme_ink_faint=6d7074
theme_accent=b3191f
theme_accent_hi=161616
theme_lcd=151515
theme_box=151515
theme_knob_face=151515
theme_knob_ring=2a2a2a
theme_knob_dot=b3191f
theme_seg_active=151515
theme_seg_active_tx=f0ead8
theme_seg_inactive=ece6d6

[tab PIANO]
art file=images/tolex.svg fit=cover
art file=images/namerail.svg x=10 y=94 w=1260 h=64
frame x=10 y=166 w=300 h=538 title="CHARACTER"
enum_v cx=160 cy=440 label="" key=character sw=220 sh=56
frame x=320 y=166 w=630 h=264 title="VOICE"
knob cx=425 cy=284 r=52 label="Decay" key=decay
knob cx=635 cy=284 r=52 label="Release" key=release
knob cx=845 cy=284 r=52 label="Hardness" key=hardness
frame x=960 y=166 w=310 h=264 title="OUTPUT"
knob cx=1115 cy=284 r=52 label="Level" key=level
# TONE: the voice's treble and drive, then the 3-band EQ (it was on the CAB page with the cab IR, which is gone)
frame x=320 y=440 w=950 h=264 title="TONE"
knob cx=415 cy=558 r=52 label="Treble" key=treble
knob cx=605 cy=558 r=52 label="Drive" key=drive
knob cx=795 cy=558 r=52 label="Low" key=low
knob cx=985 cy=558 r=52 label="Mid" key=mid
knob cx=1175 cy=558 r=52 label="High" key=high
qlinks "PIANO" = decay,release,hardness,level,treble,drive,-,-,low,mid,high,-,character

[tab FX]
art file=images/tolex.svg fit=cover
art file=images/namerail.svg x=10 y=94 w=1260 h=64
# PAN / TREM is a switch, first, then SPEED and DEPTH (the old bipolar Pan / Trem knob only loads old projects)
frame x=10 y=166 w=1260 h=264 title="VIBRATO"
knob cx=480 cy=284 r=52 label="Speed" key=rate
enum_v cx=170 cy=284 label="" key=vib_mode sw=180 sh=56
knob cx=790 cy=284 r=52 label="Depth" key=depth
knob cx=1110 cy=284 r=52 label="Chorus" key=chorus
frame x=10 y=440 w=1260 h=264 title="ENVELOPE FILTER"
knob cx=137 cy=558 r=52 label="Env Sense" key=sense
knob cx=387 cy=558 r=52 label="Env Peak" key=peak
knob cx=637 cy=558 r=52 label="Env Freq" key=freq
knob cx=887 cy=558 r=52 label="Env Range" key=range
enum_v cx=1140 cy=558 label="" key=ftype sw=160 sh=50
qlinks "FX" = vib_mode,rate,depth,chorus,sense,peak,freq,range,ftype
