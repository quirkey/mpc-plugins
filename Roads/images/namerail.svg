<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="64" viewBox="0 0 1260 64">
  <!-- the name rail: a black strip between two chrome trims, a chrome wordmark on the left -->
  <defs>
    <linearGradient id="trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="0.5" stop-color="#8d9094"/>
      <stop offset="1" stop-color="#dcdee0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#d4d7db"/>
      <stop offset="0.5" stop-color="#6f7378"/>
      <stop offset="0.62" stop-color="#b9bdc1"/>
      <stop offset="1" stop-color="#f1f2f3"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b1c"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1260" height="64" rx="3" fill="url(#rail)"/>
  <rect x="0" y="0" width="1260" height="4" fill="url(#trim)"/>
  <rect x="0" y="60" width="1260" height="4" fill="url(#trim)"/>
  <g font-family="Titillium Web" font-weight="700">
    <text x="30" y="47" font-size="44" font-style="italic" letter-spacing="1" fill="#000" opacity="0.6"
          transform="translate(1.5 2)">Roads</text>
    <text x="30" y="47" font-size="44" font-style="italic" letter-spacing="1" fill="url(#chrome)"
          stroke="#f8f8f8" stroke-width="0.6" stroke-opacity="0.6">Roads</text>
    <text x="1232" y="40" font-size="17" text-anchor="end" letter-spacing="5" fill="#b8bbbf">ELECTRIC PIANO</text>
  </g>
</svg>
