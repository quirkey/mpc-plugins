# Breaks page: the break (name, browse, bars, its waveform) across the top, SOUND, STRETCH and GRIT knobs below.
# Live text (the break name) uses a large Titillium readout, so it stays readable on the device.
# Q-Links: each column of 4 is one row of the page, which MPC outlines (qlink_bounds=column), so a column's controls
# sit together: BREAKS column 1 = sound and stretch (pitch, level, grain, half), 2 = grit, 3 = the top (select, bars);
# VARIATION column 1 = the top row (vary, repeats every, variation), column 2 = the bottom (the four weights).
# Akai grey (S950 / MPC60 front panel), dark ink, taper knobs with an S950-green arc; the break name on a dark LCD.
# Drawn by the browser renderer (vst.json "art": "html"); sizes and fixed colours in skin.css.
qlink_bounds=column
art_css=skin.css
knob_look=taper
theme_bg=c8c6bf
theme_panel=bdbbb3
theme_line=8e8b82
theme_ink=1c1c1c
theme_ink_dim=2e2e2e
theme_ink_faint=6e6b64
theme_accent=e8641c
theme_accent_hi=2a2a2a
theme_lcd=1a1f16
theme_box=1a1f16
theme_knob_face=2a2a2a
theme_knob_ring=2e2e2e
theme_knob_dot=7dff6a
theme_seg_active=7dff6a
theme_seg_active_tx=141414
theme_seg_inactive=a9a69e
theme_btn_text=f2f2f2
theme_btn_text_plain=f2f2f2

