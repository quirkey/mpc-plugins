# BITS / RATE are switches (bits_step / rate_step); the old bits / rate knobs only load old projects
enum_h cx=1060 cy=550 label="BITS" key=bits_step sw=64 sh=46
enum_h cx=1060 cy=650 label="RATE (kHz)" key=rate_step sw=48 sh=46
qlinks "BREAKS" = pitch,level,grain,half,bits_step,rate_step,-,-,break,bars

# Variation page: the pattern on top (VARY, how often it repeats, which variation); the mix of variations below.
[tab VARIATION]
frame x=10 y=92 w=1260 h=300 title="PATTERN"
knob cx=130 cy=226 r=58 label="VARY" key=vary ns=30 vs=34 bw=170
enum_h cx=500 cy=226 label="REPEATS EVERY" key=pattern sw=96 sh=46
knob cx=870 cy=226 r=48 label="VARIATION" key=seed ns=28 vs=32 bw=150
button cx=1162 cy=180 w=180 h=64 label="NEW" key=var_new img=images/btn_180x64.svg
button cx=1162 cy=280 w=180 h=64 label="PREV" key=var_prev img=images/btn_180x64.svg
frame x=10 y=404 w=770 h=300 title="VARIATION"
knob cx=110 cy=530 r=52 label="SWAP" key=swap ns=30 vs=34 bw=170
knob cx=300 cy=530 r=52 label="REPEAT" key=repeat ns=30 vs=34 bw=170
knob cx=490 cy=530 r=52 label="REVERSE" key=reverse ns=30 vs=34 bw=170
knob cx=680 cy=530 r=52 label="GAP" key=gap ns=30 vs=34 bw=170
# each slice's envelope, in % of its 16th: fade in, where it lets go, the fade out from there
frame x=790 y=404 w=480 h=300 title="SHAPE"
knob cx=870 cy=530 r=52 label="ATTACK" key=attack ns=30 vs=34 bw=150
knob cx=1030 cy=530 r=52 label="GATE" key=gate ns=30 vs=34 bw=150
knob cx=1190 cy=530 r=52 label="RELEASE" key=release ns=30 vs=34 bw=150
qlinks "VARIATION" = vary,pattern,seed,-,swap,repeat,reverse,gap,attack,gate,release

# Pads page: what each pad does while held, laid out like the MPC's pads (pad 1 bottom left); the held pad lights.
# Pads map by pad number, from either of MPC's pad layouts (the default C major scale from C5, or chromatic from
# 36). An octave, ramp, speed or velocity pad lights alongside the effect it is held with. LENGTH quantizes the pads:
# a press lands on the nearest 16th, a release plays on to whole LENGTHs (Free: exactly while held). Touching a
# tile plays its pad too.
[tab PADS]
frame x=10 y=92 w=830 h=612 title="PADS (HOLD)"
list x=26 y=136 w=798 h=552 key=pad cols=4 rows=4 th=132 gap=8 order=pads mark=1 tsize=36 tcolor=f2f2f2 talign=center
frame x=850 y=92 w=420 h=612 title="PLAY"
knob cx=925 cy=200 r=44 label="VARY" key=vary ns=28 vs=32 bw=130
knob cx=1060 cy=200 r=44 label="GRAIN" key=grain ns=28 vs=32 bw=130
knob cx=1195 cy=200 r=44 label="PITCH" key=pitch ns=28 vs=32 bw=130
enum_h cx=1060 cy=420 label="RATE (kHz)" key=rate_step sw=48 sh=46
enum_h cx=1060 cy=595 label="LENGTH" key=pad_len sw=64 sh=46
# RAMP: how fast the ramp (an octave), speed (a doubling) and velocity (a full sweep) pads move
enum_h cx=1060 cy=678 label="RAMP" key=ramp sw=76 sh=46
qlinks "PADS" = vary,grain,pitch,rate_step,pad_len,ramp
